name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Generate Next.js types
        run: bunx next typegen
      - name: Type safety
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_API_ROUTE: http://localhost:3000/api
          AUTH_SECRET: ci-placeholder-secret-not-used-at-build-time
